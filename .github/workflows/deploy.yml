name: Deploy to prod
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote command via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          command_timeout: 20m
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            git fetch origin main && git reset --hard origin/main
            docker compose --profile prod up -d --build --force-recreate
            # Fail the deploy if any service never reaches healthy.
            for i in $(seq 1 40); do
              unhealthy=$(docker compose ps --format json | grep -c '"Health":"starting"' || true)
              if [ "$unhealthy" = "0" ]; then break; fi
              sleep 5
            done
            docker compose ps
            docker compose logs --tail=200 main-service
            docker system prune -f
