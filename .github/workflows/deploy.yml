name: Deploy to prod
on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            website:
              - 'website/**'
            backend:
              - 'backend/services/main-service/**'
            compose:
              - 'docker-compose.yml'
              - 'website/docker-compose.yml'
              - 'backend/docker-compose.yml'
              - '.env.example'

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.PROJECT_PATH }}
            git fetch origin main && git reset --hard origin/main

            SERVICES=""
            if [ "${{ steps.filter.outputs.website }}" = "true" ] \
              || [ "${{ steps.filter.outputs.compose }}" = "true" ]; then
              SERVICES="$SERVICES next-js"
            fi
            if [ "${{ steps.filter.outputs.backend }}" = "true" ] \
              || [ "${{ steps.filter.outputs.compose }}" = "true" ]; then
              SERVICES="$SERVICES main-service"
            fi

            if [ -n "$SERVICES" ]; then
              echo "==> Build: $SERVICES"
              docker compose build $SERVICES
              echo "==> Restart: $SERVICES"
              docker compose up -d --no-build $SERVICES
            else
              echo "==> No service changes — nothing to do."
            fi

            docker image prune -f
            docker compose ps
