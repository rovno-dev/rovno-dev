services:
  main-service:
    build:
      context: ./services/main-service
      dockerfile: Dockerfile
      # Build-time DNS: the daemon's build container ignores the `dns:`
      # block below (that's runtime-only). Host network makes the build use
      # the host's resolv.conf, which actually resolves.
      network: host
    container_name: main-service-dev
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file: ../.env
    environment:
      # Container-network hostname — the root .env points at the prod
      # service name.
      - MAIN_DB_HOST=main-db
      # The dev frontend runs on the host at http://localhost:3000. Allow it
      # explicitly so browser XHRs aren't rejected by CORS preflight.
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      # Bind-mount source for uvicorn --reload (the Dockerfile CMD already
      # passes --reload). Storage is shared with the tg-bot dev container so
      # the Excel export can attach order-file images without a second copy.
      - ./services/main-service:/app
      - ./services/main-service/storage:/app/storage
    depends_on:
      main-db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - main-network-dev
    restart: unless-stopped
    # Same routing labels as prod (backend/docker-compose.yml). Without
    # these, traefik-dev starts with no routers, so any request to
    # http://localhost/api/... returns a bare 404 from traefik. That 404
    # carries no Access-Control-Allow-Origin header, which the browser
    # reports as a "CORS error" even though CORS was never the problem.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.main-service.rule=PathPrefix(`/api/v1`) || PathPrefix(`/docs`) || PathPrefix(`/health`)"
      - "traefik.http.routers.main-service.priority=100"
      - "traefik.http.routers.main-service.entrypoints=${ENTRYPOINT}"
      - "traefik.http.routers.main-service.tls=${TLS_ENABLED}"
      - "traefik.http.routers.main-service.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.main-service.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  main-db:
    image: postgres:15-alpine
    container_name: main-db-dev
    env_file: ../.env
    environment:
      POSTGRES_USER: ${MAIN_DB_USER}
      POSTGRES_PASSWORD: ${MAIN_DB_PASSWORD}
      POSTGRES_DB: ${MAIN_DB_NAME}
    volumes:
      # Named volume with a dev suffix so `docker compose down -v` on dev
      # can never nuke prod data (and vice versa).
      - main_db_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - main-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  valkey:
    image: valkey/valkey:7-alpine
    container_name: valkey-dev
    command: valkey-server --requirepass ${CACHE_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - valkey_data_dev:/data
    networks:
      - main-network-dev
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  main-network-dev:
    name: main-network-dev
    external: false
  default:

volumes:
  main_db_data_dev:
  valkey_data_dev:
